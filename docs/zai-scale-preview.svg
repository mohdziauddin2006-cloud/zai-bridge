<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="zsTitle zsDesc">
  <title id="zsTitle">Zai-Scale Ultra™ Neural Frame Pipeline</title>
  <desc id="zsDesc">Architectural breakdown of the real-time 32-bit legacy frame upscaling and optical-flow frame generation pipeline.</desc>

  <defs>
    <style>
      @keyframes pulseCyan {
        0%, 100% { opacity: 0.35; filter: drop-shadow(0 0 8px rgba(0,229,255,0.4)); }
        50% { opacity: 0.85; filter: drop-shadow(0 0 18px rgba(0,229,255,0.9)); }
      }
      @keyframes pulseAmber {
        0%, 100% { opacity: 0.35; filter: drop-shadow(0 0 8px rgba(255,179,0,0.4)); }
        50% { opacity: 0.85; filter: drop-shadow(0 0 18px rgba(255,179,0,0.9)); }
      }
      @keyframes flowLine {
        to { stroke-dashoffset: -40; }
      }
      .anim-flow {
        stroke-dasharray: 8 6;
        animation: flowLine 1.2s linear infinite;
      }
      .stage-card {
        transition: transform 0.25s ease, filter 0.25s ease;
      }
      .stage-card:hover {
        filter: drop-shadow(0 4px 20px rgba(0,229,255,0.35));
      }
    </style>

    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0D14"/>
      <stop offset="50%" stop-color="#0E131D"/>
      <stop offset="100%" stop-color="#07090E"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#151C28" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0E131E" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="cyanAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#00B0FF"/>
    </linearGradient>

    <linearGradient id="amberAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#FF9100"/>
    </linearGradient>

    <linearGradient id="purpleAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C4DFF"/>
      <stop offset="100%" stop-color="#651FFF"/>
    </linearGradient>

    <linearGradient id="greenAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#00B0FF"/>
    </linearGradient>

    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#202A3C" opacity="0.45"/>
    </pattern>

    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="520" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="520" rx="16" fill="url(#dotGrid)"/>
  <rect x="1" y="1" width="1198" height="518" rx="15" fill="none" stroke="#212C3F" stroke-width="1.5"/>

  <!-- Header -->
  <g transform="translate(48, 48)">
    <rect x="0" y="0" width="128" height="24" rx="12" fill="#0D2538" stroke="#00E5FF" stroke-width="1"/>
    <text x="64" y="16" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#00E5FF" text-anchor="middle" letter-spacing="1.2">PIPELINE ARCH</text>

    <text x="144" y="20" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">ZAI-SCALE ULTRA™</text>
    <text x="400" y="20" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#7E90AA">— Real-Time 32-Bit Frame Upscaling &amp; Optical-Flow Engine</text>
  </g>

  <!-- Flow Arrows connecting stages -->
  <g fill="none" stroke-width="2.5">
    <!-- 1 -> 2 -->
    <path d="M 285 235 L 340 235" stroke="#00E5FF" class="anim-flow"/>
    <polygon points="342,235 334,230 334,240" fill="#00E5FF"/>

    <!-- 2 -> 3 -->
    <path d="M 580 235 L 635 235" stroke="#7C4DFF" class="anim-flow"/>
    <polygon points="637,235 629,230 629,240" fill="#7C4DFF"/>

    <!-- 3 -> 4 -->
    <path d="M 875 235 L 930 235" stroke="#FFB300" class="anim-flow"/>
    <polygon points="932,235 924,230 924,240" fill="#FFB300"/>
  </g>

  <!-- STAGE 1: 32-Bit Guest Frame -->
  <g class="stage-card" transform="translate(48, 110)">
    <rect width="235" height="250" rx="14" fill="url(#cardGrad)" stroke="#1F2A3D" stroke-width="1.5"/>
    <rect x="0" y="0" width="235" height="6" rx="3" fill="url(#cyanAccent)"/>
    
    <text x="20" y="36" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#00E5FF" letter-spacing="1">STAGE 01 • INGESTION</text>
    <text x="20" y="62" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">32-Bit Guest Frame</text>

    <!-- Specs List -->
    <g transform="translate(20, 85)" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#8FA2BD">
      <circle cx="4" cy="6" r="3" fill="#00E5FF"/>
      <text x="16" y="10" fill="#E1E7F0" font-weight="600">ARM32 OpenGL ES</text>
      <text x="16" y="26">v1.1 / v2.0 Driver Hooks</text>

      <circle cx="4" cy="52" r="3" fill="#00E5FF"/>
      <text x="16" y="56" fill="#E1E7F0" font-weight="600">eglSwapBuffers Intercept</text>
      <text x="16" y="72">Zero-copy FBO redirect</text>

      <circle cx="4" cy="98" r="3" fill="#00E5FF"/>
      <text x="16" y="102" fill="#E1E7F0" font-weight="600">Raw Input: 720p / 30 Hz</text>
      <text x="16" y="118">Legacy resolution frame</text>
    </g>

    <rect x="18" y="210" width="199" height="26" rx="6" fill="#0D1826" stroke="#1C3048"/>
    <text x="117" y="227" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#00E5FF" text-anchor="middle">EGL HOOK • ZERO-COPY</text>
  </g>

  <!-- STAGE 2: TSR & Neural Lighting -->
  <g class="stage-card" transform="translate(345, 110)">
    <rect width="235" height="250" rx="14" fill="url(#cardGrad)" stroke="#1F2A3D" stroke-width="1.5"/>
    <rect x="0" y="0" width="235" height="6" rx="3" fill="url(#purpleAccent)"/>
    
    <text x="20" y="36" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#9D7AFF" letter-spacing="1">STAGE 02 • ENHANCER</text>
    <text x="20" y="62" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">TSR &amp; Neural Lighting</text>

    <!-- Specs List -->
    <g transform="translate(20, 85)" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#8FA2BD">
      <circle cx="4" cy="6" r="3" fill="#7C4DFF"/>
      <text x="16" y="10" fill="#E1E7F0" font-weight="600">Temporal Upscaling</text>
      <text x="16" y="26">FSR / DLSS-style jitter resolve</text>

      <circle cx="4" cy="52" r="3" fill="#7C4DFF"/>
      <text x="16" y="56" fill="#E1E7F0" font-weight="600">PBR Normal Reconstruction</text>
      <text x="16" y="72">Specular &amp; Bloom recovery</text>

      <circle cx="4" cy="98" r="3" fill="#7C4DFF"/>
      <text x="16" y="102" fill="#E1E7F0" font-weight="600">Resolution: 1080p / 1440p</text>
      <text x="16" y="118">Tonic contrast curve HDR</text>
    </g>

    <rect x="18" y="210" width="199" height="26" rx="6" fill="#17112E" stroke="#31225A"/>
    <text x="117" y="227" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#B388FF" text-anchor="middle">NEURAL SHADER COMPOSE</text>
  </g>

  <!-- STAGE 3: Optical-Flow MFG -->
  <g class="stage-card" transform="translate(640, 110)">
    <rect width="235" height="250" rx="14" fill="url(#cardGrad)" stroke="#1F2A3D" stroke-width="1.5"/>
    <rect x="0" y="0" width="235" height="6" rx="3" fill="url(#amberAccent)"/>
    
    <text x="20" y="36" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#FFB300" letter-spacing="1">STAGE 03 • SYNTHESIZER</text>
    <text x="20" y="62" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Optical-Flow MFG</text>

    <!-- Specs List -->
    <g transform="translate(20, 85)" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#8FA2BD">
      <circle cx="4" cy="6" r="3" fill="#FFB300"/>
      <text x="16" y="10" fill="#E1E7F0" font-weight="600">Dense Motion Vectors</text>
      <text x="16" y="26">Hierarchical block matching</text>

      <circle cx="4" cy="52" r="3" fill="#FFB300"/>
      <text x="16" y="56" fill="#E1E7F0" font-weight="600">Bi-Directional Interpolation</text>
      <text x="16" y="72">Occlusion-aware synthesis</text>

      <circle cx="4" cy="98" r="3" fill="#FFB300"/>
      <text x="16" y="102" fill="#E1E7F0" font-weight="600">2x / 3x / 4x Multiplier</text>
      <text x="16" y="118">30 FPS In -&gt; 90/120 FPS Synth</text>
    </g>

    <rect x="18" y="210" width="199" height="26" rx="6" fill="#241B08" stroke="#4D380D"/>
    <text x="117" y="227" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#FFC107" text-anchor="middle">SUB-MILLI FLOW WARP</text>
  </g>

  <!-- STAGE 4: 120 Hz Low-Latency Output -->
  <g class="stage-card" transform="translate(935, 110)">
    <rect width="217" height="250" rx="14" fill="url(#cardGrad)" stroke="#1F2A3D" stroke-width="1.5"/>
    <rect x="0" y="0" width="217" height="6" rx="3" fill="url(#greenAccent)"/>
    
    <text x="20" y="36" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#00E676" letter-spacing="1">STAGE 04 • DISPLAY</text>
    <text x="20" y="62" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">120 Hz Present</text>

    <!-- Specs List -->
    <g transform="translate(20, 85)" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#8FA2BD">
      <circle cx="4" cy="6" r="3" fill="#00E676"/>
      <text x="16" y="10" fill="#E1E7F0" font-weight="600">Adaptive Frame Pacing</text>
      <text x="16" y="26">Micro-stutter elimination</text>

      <circle cx="4" cy="52" r="3" fill="#00E676"/>
      <text x="16" y="56" fill="#E1E7F0" font-weight="600">VSync Lock &amp; Low Latency</text>
      <text x="16" y="72">&lt; 8.4 ms frame deadline</text>

      <circle cx="4" cy="98" r="3" fill="#00E676"/>
      <text x="16" y="102" fill="#E1E7F0" font-weight="600">Hardware Native Flip</text>
      <text x="16" y="118">Adreno / Mali / PowerVR</text>
    </g>

    <rect x="18" y="210" width="181" height="26" rx="6" fill="#0A2216" stroke="#144D30"/>
    <text x="108" y="227" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#00E676" text-anchor="middle">FLUID 120 FPS CADENCE</text>
  </g>

  <!-- Metric Telemetry Footer HUD -->
  <g transform="translate(48, 395)">
    <rect width="1104" height="85" rx="12" fill="#0C1019" stroke="#1D2738" stroke-width="1.2"/>
    
    <!-- Item 1 -->
    <g transform="translate(40, 20)">
      <text x="0" y="14" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#7588A3" letter-spacing="0.8">ENGINE STATUS</text>
      <text x="0" y="42" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#00E5FF">HARDWARE ACTIVE</text>
      <circle cx="160" cy="35" r="4" fill="#00E5FF"/>
    </g>

    <line x1="280" y1="15" x2="280" y2="70" stroke="#1F2A3D" stroke-width="1"/>

    <!-- Item 2 -->
    <g transform="translate(320, 20)">
      <text x="0" y="14" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#7588A3" letter-spacing="0.8">TARGET REFRESH</text>
      <text x="0" y="42" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">120 FPS <tspan font-size="13" font-weight="400" fill="#7588A3">(4x MFG)</tspan></text>
    </g>

    <line x1="560" y1="15" x2="560" y2="70" stroke="#1F2A3D" stroke-width="1"/>

    <!-- Item 3 -->
    <g transform="translate(600, 20)">
      <text x="0" y="14" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#7588A3" letter-spacing="0.8">INPUT LATENCY BUDGET</text>
      <text x="0" y="42" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#00E676">&lt; 8.4 ms <tspan font-size="13" font-weight="400" fill="#7588A3">OVERHEAD</tspan></text>
    </g>

    <line x1="840" y1="15" x2="840" y2="70" stroke="#1F2A3D" stroke-width="1"/>

    <!-- Item 4 -->
    <g transform="translate(880, 20)">
      <text x="0" y="14" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#7588A3" letter-spacing="0.8">SUPPORTED ARCHITECTURES</text>
      <text x="0" y="42" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#FFB300">ARM64 • ARM32 • X86</text>
    </g>
  </g>
</svg>
