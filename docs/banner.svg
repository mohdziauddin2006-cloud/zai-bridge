<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Zai-Bridge — Universal 32-to-64-Bit Android Translation Container</title>
  <desc id="desc">Obsidian banner with an electric cyan and warm amber infinity-bridge emblem, the Zai-Bridge wordmark, subtitle and architecture badges.</desc>

  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0E14"/>
      <stop offset="0.55" stop-color="#0C111B"/>
      <stop offset="1" stop-color="#0B0E14"/>
    </linearGradient>
    <linearGradient id="infinity" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="0.5" stop-color="#7CEBFF"/>
      <stop offset="1" stop-color="#FFB300"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C7D4E6"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#FFB300" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amberGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFB300" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFB300" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#263042" stroke-width="1" stroke-opacity="0.22"/>
    </pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <clipPath id="frame">
      <rect width="1280" height="360" rx="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="360" fill="url(#canvas)"/>
    <rect width="1280" height="360" fill="url(#grid)"/>
    <circle cx="250" cy="150" r="230" fill="url(#cyanGlow)"/>
    <circle cx="1030" cy="250" r="240" fill="url(#amberGlow)"/>
    <rect x="0.5" y="0.5" width="1279" height="359" rx="22" fill="none" stroke="#263042"/>

    <!-- Emblem: two interlocking loops forming an infinity bridge -->
    <g filter="url(#soft)" opacity="0.55">
      <path d="M150 176C150 122 214 118 252 158c34 36 58 44 76 44 34 0 58-26 58-58s-24-58-58-58c-18 0-42 8-76 44-38 40-102 36-102-18"
            fill="none" stroke="url(#infinity)" stroke-width="12" stroke-linecap="round"/>
    </g>
    <path d="M150 176C150 122 214 118 252 158c34 36 58 44 76 44 34 0 58-26 58-58s-24-58-58-58c-18 0-42 8-76 44-38 40-102 36-102-18"
          fill="none" stroke="url(#infinity)" stroke-width="7" stroke-linecap="round"/>

    <!-- Bridge deck and pylons -->
    <path d="M132 214H496" stroke="#263042" stroke-width="2"/>
    <path d="M214 214V190M290 214V178M366 214V190" stroke="#FFB300" stroke-opacity="0.85" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M214 190L252 158M290 178L316 160M366 190L332 162" stroke="#00E5FF" stroke-opacity="0.5" stroke-width="1.5"/>

    <!-- Wordmark -->
    <text x="556" y="146" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="66" font-weight="700" letter-spacing="1.5" fill="url(#wordmark)">ZAI-BRIDGE</text>
    <rect x="558" y="164" width="360" height="3" rx="1.5" fill="url(#rule)"/>

    <text x="558" y="206" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#C7D4E6">Universal 32-to-64-Bit Android Translation Container</text>
    <text x="558" y="234" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#8A99AD">&amp; Zai-Scale Ultra Graphics Engine</text>

    <!-- Architecture badges -->
    <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.6">
      <g>
        <rect x="558" y="266" width="152" height="30" rx="15" fill="#141923" stroke="#263042"/>
        <circle cx="576" cy="281" r="3.5" fill="#00E5FF"/>
        <text x="588" y="286" fill="#C7D4E6">UNICORN ARM32</text>
      </g>
      <g>
        <rect x="720" y="266" width="140" height="30" rx="15" fill="#141923" stroke="#263042"/>
        <circle cx="738" cy="281" r="3.5" fill="#FFB300"/>
        <text x="750" y="286" fill="#C7D4E6">DLSS-5 / FSR</text>
      </g>
      <g>
        <rect x="870" y="266" width="112" height="30" rx="15" fill="#141923" stroke="#263042"/>
        <circle cx="888" cy="281" r="3.5" fill="#00E5FF"/>
        <text x="900" y="286" fill="#C7D4E6">4 ABIs</text>
      </g>
      <g>
        <rect x="992" y="266" width="130" height="30" rx="15" fill="#141923" stroke="#263042"/>
        <circle cx="1010" cy="281" r="3.5" fill="#FFB300"/>
        <text x="1022" y="286" fill="#C7D4E6">120 Hz MFG</text>
      </g>
    </g>

    <!-- Version chip -->
    <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
      <rect x="1124" y="42" width="104" height="30" rx="15" fill="#0E1420" stroke="#00E5FF" stroke-opacity="0.35"/>
      <text x="1176" y="62" font-size="12" font-weight="700" fill="#00E5FF" text-anchor="middle" letter-spacing="1">v2.0.0</text>
    </g>
  </g>
</svg>
