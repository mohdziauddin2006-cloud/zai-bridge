plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ziauddin.zaibridge'
    compileSdk 36
    ndkVersion '26.1.10909125'

    defaultConfig {
        applicationId 'com.ziauddin.zaibridge'
        // Android 8.0 is the floor for the foreground dataSync import service
        // and for the Material 3 launcher without legacy shims.
        minSdk 26
        targetSdk 35
        versionCode 320
        versionName '3.2.0'

        // One universal APK for every phone architecture:
        //   arm64-v8a / x86_64 -> Unicorn ARM32 translation core
        //   armeabi-v7a / x86  -> native passthrough (the guest is already
        //                         the process architecture)
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64', 'x86'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -O2 -fno-exceptions -fno-rtti'
                arguments '-DANDROID_STL=c++_shared', '-DCMAKE_SHARED_LINKER_FLAGS=-Wl,-z,max-page-size=16384'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The Unicorn core is linked statically; only one wrapper .so per ABI ships.
    // Legacy packaging keeps every variant extracted on install, because the
    // bridge dlopen()s by absolute path from the guest's own class loader.
    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    // The bundled 32-bit runtime must not be re-compressed: the native side
    // mmaps these files and a partially extracted bundle is useless offline.
    androidResources {
        noCompress 'so', 'jar', 'obb'
    }
}

dependencies {
    // The launcher shell only: Material 3 components, RecyclerView grid and the
    // bottom sheets. Nothing here reaches the guest's class loader.
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.palette:palette:1.0.0'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.8.7'
}
