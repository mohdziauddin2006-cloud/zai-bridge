plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ziauddin.zaibridge'
    compileSdk 34
    ndkVersion '26.1.10909125'

    defaultConfig {
        applicationId 'com.ziauddin.zaibridge'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'

        // The container itself is 64-bit only: the whole point of the bridge is
        // that the host process is arm64-v8a while the guest payload is ARM32.
        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -O2 -fno-exceptions -fno-rtti'
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The Unicorn core is linked statically; only the bridge .so ships.
    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

// No third-party runtime dependencies on purpose: the launcher UI is built from
// framework widgets only, so the container has nothing to pull in at boot.
dependencies {
}
